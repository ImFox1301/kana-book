services:
  kana-tetrad:
    image: ghcr.io/imfox1301/kana-book:latest
    container_name: kana-tetrad
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Аккаунты и синхронизация прогресса
  kana-api:
    image: ghcr.io/imfox1301/kana-book-api:latest
    container_name: kana-api
    restart: unless-stopped
    environment:
      - DB_URL=jdbc:postgresql://kana-db:5432/kana
      - DB_USER=kana
      - DB_PASSWORD=${DB_PASSWORD:?укажите DB_PASSWORD в .env}
    depends_on:
      kana-db:
        condition: service_healthy
    mem_limit: 384m
    labels:
      - com.centurylinklabs.watchtower.enable=true

  kana-db:
    image: postgres:16-alpine
    container_name: kana-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=kana
      - POSTGRES_USER=kana
      - POSTGRES_PASSWORD=${DB_PASSWORD:?укажите DB_PASSWORD в .env}
    volumes:
      - kana_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kana -d kana"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m

  # HTTPS для домена из .env (SITE_DOMAIN): сам получает и продлевает сертификат Let's Encrypt
  caddy:
    image: caddy:2.8-alpine
    container_name: kana-caddy
    restart: unless-stopped
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:?укажите SITE_DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kana-tetrad
      - kana-api

  # Следит за новыми образами в GHCR и перезапускает kana-tetrad и kana-api
  watchtower:
    # поддерживаемый форк: оригинальный containrrr/watchtower не работает с Docker 29 (слишком старая версия API)
    image: nickfedor/watchtower:1.23.0
    container_name: kana-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # если пакеты в GHCR приватные: docker login ghcr.io на сервере, затем раскомментировать
      # - /root/.docker/config.json:/config.json:ro
    command: --label-enable --cleanup --interval 120

volumes:
  kana_pgdata:
  caddy_data:
  caddy_config:
