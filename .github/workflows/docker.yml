name: Build and publish images

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: SITE_DOMAIN=example.com DB_PASSWORD=x docker compose -f docker-compose.yml config -q

      - name: Recognizer self-test
        run: node tools/test.js | tee test.log && ! grep -q "level 0.6 top1 [0-8][0-9]\." test.log

      - uses: docker/setup-buildx-action@v3
        if: github.ref == 'refs/heads/main'

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name in lower case
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kana
          POSTGRES_USER: kana
          POSTGRES_PASSWORD: kana
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kana" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Tests (PostgreSQL)
        working-directory: server
        env:
          DB_URL: jdbc:postgresql://localhost:5432/kana
        run: gradle test bootJar --no-daemon

      - name: End-to-end checks (sync on real API + PostgreSQL, Azbuka)
        env:
          DB_URL: jdbc:postgresql://localhost:5432/kana
          COOKIE_SECURE: 'false'
        run: |
          python3 build.py
          java -jar server/build/libs/kana-api.jar > api.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done
          API_URL=http://127.0.0.1:8080 node tools/e2e/serve.js &
          npm i --no-save playwright@1.56.0 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          fail=0
          for t in sync abc lessons; do
            # провалы — в аннотации запуска, чтобы их было видно без скачивания логов
            node tools/e2e/$t-e2e.js http://localhost:8790 > $t.log 2>&1 || { fail=1; grep -E "FAIL|Error|ошибка|    at " $t.log | head -15 | sed "s/^/::error title=$t-e2e::/"; }
            cat $t.log
          done
          node tools/e2e/haptics-ios.js http://localhost:8790/ || { fail=1; echo '::error title=haptics-ios::iPhone haptics check failed'; }
          [ $fail = 0 ] || { tail -30 api.log; exit 1; }

      - uses: docker/setup-buildx-action@v3
        if: github.ref == 'refs/heads/main'

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name in lower case
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        if: github.ref == 'refs/heads/main'
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: tts
          load: true
          tags: kana-tts:test

      - name: Smoke test
        run: |
          docker run -d --name tts -p 8081:8081 kana-tts:test
          trap 'docker logs tts' EXIT
          for i in $(seq 60); do curl -sf http://127.0.0.1:8081/api/tts/health && break; sleep 2; done
          curl -sf -o neko.mp3 "http://127.0.0.1:8081/api/tts?v=m&t=%E3%81%AD%E3%81%93"
          curl -sf -o hashi.mp3 "http://127.0.0.1:8081/api/tts?v=f&t=%E3%81%AF%E3%81%97&k=%E7%AE%B8"
          ls -l neko.mp3 hashi.mp3
          test "$(head -c 1 neko.mp3 | od -An -tx1 | tr -d ' ')" = "ff"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8081/api/tts?v=m&t=abc')" = 400
          docker stats --no-stream tts

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name in lower case
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-tts" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        if: github.ref == 'refs/heads/main'
        with:
          context: tts
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
