server:
  port: 8080
  forward-headers-strategy: native
  shutdown: graceful
  tomcat:
    max-swallow-size: 6MB
    threads:
      max: 32

spring:
  application:
    name: kana-api
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kana}
    username: ${DB_USER:kana}
    password: ${DB_PASSWORD:kana}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: false

kana:
  # Secure-cookie: true за HTTPS (Caddy); false только для локальной разработки по http
  cookie-secure: ${COOKIE_SECURE:true}
  session-days: 180
  registration-open: ${REGISTRATION_OPEN:true}
  push:
    # контакт для push-сервисов (VAPID); пусто — адрес сайта, на котором подписались
    subject: ${PUSH_SUBJECT:}

logging:
  level:
    root: INFO
